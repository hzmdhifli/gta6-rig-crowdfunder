<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help me build the ultimate GTA VI setup!</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Lemon.js for overlay checkout -->
  <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Live Notification Toast -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Top Left: GTA VI Countdown Widget -->
  <div class="countdown-widget" id="gta-countdown-widget">
    <div class="countdown-badge-header">
      <span class="countdown-live-dot"></span>
      <span class="countdown-badge-title">GTA VI LAUNCH</span>
    </div>
    <div class="countdown-timer" id="countdown-timer">
      <div class="cd-box"><span class="cd-val" id="cd-days">00</span><span class="cd-lbl">DAYS</span></div>
      <span class="cd-colon">:</span>
      <div class="cd-box"><span class="cd-val" id="cd-hours">00</span><span class="cd-lbl">HRS</span></div>
      <span class="cd-colon">:</span>
      <div class="cd-box"><span class="cd-val" id="cd-mins">00</span><span class="cd-lbl">MIN</span></div>
      <span class="cd-colon">:</span>
      <div class="cd-box"><span class="cd-val" id="cd-secs">00</span><span class="cd-lbl">SEC</span></div>
    </div>
  </div>

  <!-- Top Floating Controls: Real-time Live Status Badge -->
  <div class="top-nav">
    <div class="stream-badge" id="stream-status" title="Real-time Stream Status">
      <span class="status-dot"></span>
      <span class="status-text">Live</span>
    </div>
  </div>

  <!-- Main Showcase Container (Exact replica of user reference) -->
  <main class="page-container">
    <div class="content-wrapper">
      
      <!-- GTA VI Logo -->
      <div class="logo-box">
        <img src="gta6-logo.png" alt="Grand Theft Auto VI" class="gta-logo" />
      </div>

      <!-- Headline -->
      <h1 class="headline">
        Help me build the ultimate<br>
        <span class="highlight-text">GTA VI</span> setup!
      </h1>

      <!-- Description -->
      <p class="description">
        Let’s get ready for the next chapter together.<br>
        Your support helps me upgrade my setup for<br>
        GTA 6’s release! 🎮
      </p>

      <!-- Progress Bar -->
      <div class="progress-wrap">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="goal-progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <!-- Raised vs Goal Stats -->
      <div class="stats-row">
        <div class="stat-col">
          <div class="stat-value" id="total-raised">$0</div>
          <div class="stat-label">Raised</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-col">
          <div class="stat-value" id="goal-target">$4,500</div>
          <div class="stat-label">Goal</div>
        </div>
      </div>

      <!-- Main Donate CTA Button -->
      <div class="cta-wrap">
        <a id="main-donate-link" href="https://hazemdhifli.lemonsqueezy.com/checkout/buy/c9b6e790-4766-45c5-b677-7c625443bc8a" target="_blank" rel="noopener noreferrer" class="btn-donate">
          <span>Donate Now</span>
          <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </a>
      </div>

    </div>
  </main>

  <!-- Bottom Vice City Skyline with ambient glow -->
  <div class="skyline-container">
    <div class="skyline-glow"></div>
    <img src="skyline.png" alt="Vice City Skyline" class="skyline-img" />
  </div>

  <script src="app.js"></script>
</body>
</html>
